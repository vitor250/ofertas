<title>Checklist Sanitário Pro</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: app de celular em coluna única (max 480px), barra de abas fixa embaixo, relatório como folha A4 */
:root{
  --bg:#eef2f1; --surface:#ffffff; --ink:#14302b; --muted:#5d716c; --line:#d6dfdc;
  --accent:#0f6b5c; --accent-ink:#ffffff; --accent-soft:#dcefe9;
  --ok:#1d8a4e; --ok-soft:#dff3e7; --bad:#c8402f; --bad-soft:#fbe4df; --na:#8a8f8d; --na-soft:#eceeed;
  --warn:#b7791f;
  --sheet:#ffffff; --sheet-ink:#1b2422;
  --f-display:"Bricolage Grotesque", "Trebuchet MS", sans-serif;
  --f-body:"Figtree", "Segoe UI", Roboto, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d1715; --surface:#15221f; --ink:#e3eeeb; --muted:#93a8a2; --line:#273935;
  --accent:#3fb8a0; --accent-ink:#06201b; --accent-soft:#173a33;
  --ok:#4cc483; --ok-soft:#163b27; --bad:#f07a68; --bad-soft:#41201b; --na:#9aa3a0; --na-soft:#232e2b;
  --warn:#e0a84a; --sheet:#1b2926; --sheet-ink:#e3eeeb; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1715; --surface:#15221f; --ink:#e3eeeb; --muted:#93a8a2; --line:#273935;
  --accent:#3fb8a0; --accent-ink:#06201b; --accent-soft:#173a33;
  --ok:#4cc483; --ok-soft:#163b27; --bad:#f07a68; --bad-soft:#41201b; --na:#9aa3a0; --na-soft:#232e2b;
  --warn:#e0a84a; --sheet:#1b2926; --sheet-ink:#e3eeeb; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
*{box-sizing:border-box}
.app{max-width:480px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 96px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:18px 10px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{width:38px;height:38px;border-radius:10px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:15px;flex:none}
.brand h1{font-family:var(--f-display);font-size:19px;font-weight:800;margin:0;letter-spacing:-.01em}
.brand small{display:block;color:var(--muted);font-size:12px}
.demo{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--warn);border:1px solid currentColor;border-radius:999px;padding:3px 8px;white-space:nowrap}
h2{font-family:var(--f-display);font-weight:800;font-size:24px;margin:8px 0 2px;letter-spacing:-.015em;text-wrap:balance}
.sub{color:var(--muted);margin:0 0 14px}
.label{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:700;background:var(--accent);color:var(--accent-ink);width:100%}
.btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
.row{display:flex;gap:10px;align-items:center}
.grow{flex:1;min-width:0}
/* clientes */
.client{display:flex;gap:12px;align-items:center;text-align:left;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.client.sel{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.client b{display:block;font-size:15px}
.client span{color:var(--muted);font-size:13px}
.score{font-family:var(--f-display);font-weight:800;font-size:22px;font-variant-numeric:tabular-nums;min-width:58px;text-align:right}
.tone-ok{color:var(--ok)} .tone-mid{color:var(--warn)} .tone-bad{color:var(--bad)}
/* visita */
.progress{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);transition:width .3s}
.sumrow{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pill{border-radius:10px;padding:8px 10px;font-size:12px;font-weight:600}
.pill strong{display:block;font-family:var(--f-display);font-size:20px;font-variant-numeric:tabular-nums}
.p-ok{background:var(--ok-soft);color:var(--ok)} .p-bad{background:var(--bad-soft);color:var(--bad)} .p-na{background:var(--na-soft);color:var(--na)}
details.block{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
details.block summary{list-style:none;display:flex;gap:10px;align-items:center;padding:14px;cursor:pointer}
details.block summary::-webkit-details-marker{display:none}
.code{font-family:var(--f-mono);font-size:11.5px;color:var(--accent);background:var(--accent-soft);border-radius:6px;padding:2px 6px;flex:none}
.bname{font-weight:700}
.bmeta{font-size:12px;color:var(--muted)}
.chev{transition:transform .2s;color:var(--muted)}
details[open] .chev{transform:rotate(90deg)}
.item{border-top:1px solid var(--line);padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.item p{margin:0}
.item .ref{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.seg button{border:1.5px solid var(--line);background:transparent;border-radius:10px;padding:8px 0;font-weight:700;font-size:13px}
.seg button[aria-pressed="true"].c{background:var(--ok);border-color:var(--ok);color:#fff}
.seg button[aria-pressed="true"].nc{background:var(--bad);border-color:var(--bad);color:#fff}
.seg button[aria-pressed="true"].na{background:var(--na);border-color:var(--na);color:#fff}
.ncbox{background:var(--bad-soft);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:8px}
.ncbox label{font-size:12px;font-weight:600;color:var(--bad)}
.ncbox input,.ncbox textarea,.ncbox select{width:100%;font:inherit;font-size:14px;border:1px solid var(--line);border-radius:8px;padding:8px;background:var(--surface);color:var(--ink)}
.ncbox textarea{min-height:54px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.photo{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.photo img{width:64px;height:64px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
.filebtn{font-size:13px;font-weight:600;color:var(--bad);border:1.5px dashed var(--bad);border-radius:8px;padding:8px 10px;cursor:pointer}
.filebtn input{display:none}
/* relatório (folha) */
.sheet{background:var(--sheet);color:var(--sheet-ink);border:1px solid var(--line);border-radius:6px;padding:20px 18px;box-shadow:0 8px 24px -16px rgba(0,0,0,.35)}
.sheet .shead{display:flex;justify-content:space-between;gap:12px;border-bottom:2px solid var(--accent);padding-bottom:12px;margin-bottom:12px}
.sheet h3{font-family:var(--f-display);font-size:17px;margin:0;line-height:1.2}
.sheet .tiny{font-size:11.5px;color:var(--muted)}
.gauge{display:flex;align-items:center;gap:14px;margin:6px 0 14px}
.bars{display:flex;flex-direction:column;gap:7px;margin-bottom:16px}
.bar{display:grid;grid-template-columns:minmax(0,1fr) 120px 38px;gap:8px;align-items:center;font-size:12.5px}
.bar .t{height:7px;background:var(--line);border-radius:99px;overflow:hidden}
.bar .t i{display:block;height:100%}
.bar .v{text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:12.5px;min-width:420px}
th{text-align:left;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--line);padding:6px 6px 6px 0}
td{border-bottom:1px solid var(--line);padding:8px 6px 8px 0;vertical-align:top}
td img{width:46px;height:46px;object-fit:cover;border-radius:6px}
.sign{margin-top:22px;display:flex;justify-content:space-between;gap:16px;font-size:12px}
.sign div{flex:1;border-top:1px solid var(--sheet-ink);padding-top:6px;text-align:center}
.note{font-size:12.5px;color:var(--muted);background:var(--accent-soft);border-radius:10px;padding:10px 12px}
/* histórico */
.chart svg{width:100%;height:auto;display:block}
.hist li{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line)}
.hist{list-style:none;margin:0;padding:0}
/* abas */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);
  padding:6px max(10px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px));z-index:5}
nav.tabs .in{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
nav.tabs button{border:0;background:transparent;border-radius:10px;padding:6px 0;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;font-weight:600;color:var(--muted)}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button[aria-current="page"]{color:var(--accent);background:var(--accent-soft)}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:10px;font-size:13px;max-width:min(90vw,420px);z-index:9}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>

<div class="app">
  <header class="top">
    <div class="brand">
      <div class="logo" aria-hidden="true">CS</div>
      <div><h1>Checklist Sanitário Pro</h1><small id="consultora">Ana Lima · Nutricionista · CRN-3 00000</small></div>
    </div>
    <span class="demo">Exemplo</span>
  </header>

  <main id="view"></main>
</div>

<nav class="tabs" aria-label="Seções">
  <div class="in">
    <button data-tab="clientes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 21V8l9-5 9 5v13"/><path d="M9 21v-7h6v7"/></svg>Clientes</button>
    <button data-tab="visita"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8l1.5 1.5L13 7M9 14h6M9 17h4"/></svg>Visita</button>
    <button data-tab="relatorio"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 3h7l5 5v13H7z"/><path d="M14 3v5h5M10 13h6M10 17h6"/></svg>Relatório</button>
    <button data-tab="historico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19h16"/><path d="M5 15l4-4 4 3 6-7"/></svg>Histórico</button>
  </div>
</nav>
<div class="toast" id="toast" hidden></div>

<script>
// Checklist baseado na RDC 216/2004 (Anvisa). Texto resumido — precisa de revisão técnica antes da venda.
const BLOCKS=[
 {code:"4.1",name:"Edificação e instalações",items:[
  ["4.1.3","Piso, parede e teto lisos, impermeáveis, laváveis e em bom estado"],
  ["4.1.4","Portas da área de preparo com fechamento automático; janelas com tela milimetrada"],
  ["4.1.8","Luminárias da área de preparo protegidas contra quebra e queda"],
  ["4.1.10","Banheiros e vestiários sem comunicação direta com a área de preparo"],
  ["4.1.12","Lavatório exclusivo para as mãos, com sabonete antisséptico, papel toalha e lixeira de pedal"]]},
 {code:"4.2",name:"Higienização",items:[
  ["4.2.2","Higienização feita por funcionários capacitados"],
  ["4.2.3","Registro das operações de limpeza e desinfecção"],
  ["4.2.6","Saneantes regularizados na Anvisa e guardados longe dos alimentos"],
  ["4.2.9","Utensílios de limpeza da área de preparo exclusivos para ela"]]},
 {code:"4.3",name:"Controle de vetores e pragas",items:[
  ["4.3.1","Ausência de vetores, pragas e sinais da presença deles"],
  ["4.3.3","Comprovante de execução do controle químico por empresa especializada"]]},
 {code:"4.4",name:"Abastecimento de água",items:[
  ["4.4.3","Gelo e vapor produzidos com água potável"],
  ["4.4.5","Reservatório higienizado a cada 6 meses, com registro"]]},
 {code:"4.5",name:"Manejo de resíduos",items:[
  ["4.5.2","Lixeiras com tampa acionada sem contato manual"],
  ["4.5.3","Resíduos retirados com frequência e guardados em área isolada"]]},
 {code:"4.6",name:"Manipuladores",items:[
  ["4.6.1","Controle de saúde dos manipuladores registrado"],
  ["4.6.4","Lavagem das mãos ao chegar, ao trocar de tarefa e após o banheiro; cartazes visíveis"],
  ["4.6.6","Uniforme limpo, cabelo preso e protegido, sem adornos"],
  ["4.6.7","Capacitação periódica em higiene, com registro"]]},
 {code:"4.7",name:"Matérias-primas e armazenamento",items:[
  ["4.7.3","Inspeção das mercadorias no recebimento (temperatura, embalagem, validade)"],
  ["4.7.6","Armazenamento sobre estrados, afastado do piso e das paredes"],
  ["4.7.4","Produtos identificados e dentro da validade"]]},
 {code:"4.8",name:"Preparação do alimento",items:[
  ["4.8.10","Cocção atinge pelo menos 70 °C no centro do alimento"],
  ["4.8.12","Descongelamento sob refrigeração (abaixo de 5 °C)"],
  ["4.8.15","Prontos mantidos acima de 60 °C (quente) ou abaixo de 5 °C (frio)"],
  ["4.8.11","Óleo de fritura até 180 °C e trocado quando alterado"]]},
 {code:"4.11",name:"Documentação",items:[
  ["4.11.1","Manual de Boas Práticas disponível para equipe e fiscalização"],
  ["4.11.4","Os 4 POPs obrigatórios implementados e registrados"],
  ["4.12","Responsável pela manipulação capacitado"]]}
];
const ALL=BLOCKS.flatMap(b=>b.items.map(i=>({block:b.code,ref:i[0],text:i[1]})));
const CLIENTS=[
 {id:"p",name:"Padaria Pão de Ouro",type:"Padaria",city:"Campinas/SP",hist:[["Jul",54],["Ago",61],["Set",68]]},
 {id:"r",name:"Restaurante Sabor Caseiro",type:"Restaurante",city:"Campinas/SP",hist:[["Ago",72],["Set",79]]},
 {id:"d",name:"Marmita Fit Delivery",type:"Delivery",city:"Sumaré/SP",hist:[["Set",58]]}
];
// Visita de exemplo da padaria: maioria conforme, algumas não conformidades realistas
const SAMPLE_NC={
 "4.1.4":{obs:"Porta da cozinha sem mola, fica aberta durante o expediente.",resp:"Proprietário",prazo:"15 dias",acao:"Instalar mola ou fechamento automático na porta."},
 "4.2.3":{obs:"Não há planilha de registro da limpeza.",resp:"Gerente",prazo:"7 dias",acao:"Implantar planilha diária de limpeza (modelo entregue)."},
 "4.4.5":{obs:"Última limpeza da caixa d'água sem comprovante.",resp:"Proprietário",prazo:"30 dias",acao:"Contratar higienização do reservatório e arquivar o certificado."},
 "4.6.7":{obs:"Equipe nova sem registro de capacitação.",resp:"Consultora",prazo:"20 dias",acao:"Realizar treinamento de manipuladores com lista de presença."},
 "4.7.6":{obs:"Sacos de farinha direto no piso do estoque.",resp:"Estoquista",prazo:"7 dias",acao:"Usar estrados e afastar 10 cm das paredes."},
 "4.8.15":{obs:"Vitrine de salgados medindo 48 °C.",resp:"Gerente",prazo:"Imediato",acao:"Regular a estufa para acima de 60 °C e registrar a temperatura 2x ao dia."}
};
const SAMPLE_NA=["4.8.11"];
function sampleAnswers(){const a={};ALL.forEach(i=>{a[i.ref]={v:SAMPLE_NC[i.ref]?"nc":(SAMPLE_NA.includes(i.ref)?"na":"c"),...(SAMPLE_NC[i.ref]||{})}});return a}

const KEY="csp-demo-v1";
let S={tab:"visita",client:"p",answers:sampleAnswers(),photos:{}};
try{const s=JSON.parse(localStorage.getItem(KEY)||"null");if(s&&s.answers){S={...S,...s,photos:{}}}}catch(e){}
function save(){try{const {photos,...rest}=S;localStorage.setItem(KEY,JSON.stringify(rest))}catch(e){}}

const $=s=>document.querySelector(s);
const esc=t=>String(t??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const client=()=>CLIENTS.find(c=>c.id===S.client);
function stats(filter){const it=ALL.filter(i=>!filter||i.block===filter);let c=0,nc=0,na=0,open=0;
 it.forEach(i=>{const v=S.answers[i.ref]?.v;if(v==="c")c++;else if(v==="nc")nc++;else if(v==="na")na++;else open++});
 const pct=c+nc?Math.round(c/(c+nc)*100):0;return {c,nc,na,open,total:it.length,pct}}
const tone=p=>p>=80?"ok":p>=60?"mid":"bad";
const toneColor=p=>p>=80?"var(--ok)":p>=60?"var(--warn)":"var(--bad)";
const today=new Date().toLocaleDateString("pt-BR");

function toast(msg){const t=$("#toast");t.textContent=msg;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>t.hidden=true,3200)}

function render(){
 document.querySelectorAll("nav.tabs button").forEach(b=>b.setAttribute("aria-current",b.dataset.tab===S.tab?"page":"false"));
 ({clientes:vClientes,visita:vVisita,relatorio:vRelatorio,historico:vHistorico})[S.tab]();
 window.scrollTo(0,0);
}

function vClientes(){
 $("#view").innerHTML=`<h2>Clientes</h2><p class="sub">Escolha o estabelecimento para iniciar ou continuar a visita.</p>
 <div class="stack">${CLIENTS.map(c=>{const last=c.id===S.client?stats().pct:c.hist[c.hist.length-1][1];
  return `<button class="client ${c.id===S.client?"sel":""}" data-client="${c.id}">
   <div class="grow"><b>${esc(c.name)}</b><span>${c.type} · ${c.city} · ${c.hist.length+(c.id===S.client?1:0)} visitas</span></div>
   <div class="score tone-${tone(last)}">${last}%</div></button>`}).join("")}
 <button class="btn ghost" id="addc">+ Novo cliente</button></div>`;
 document.querySelectorAll("[data-client]").forEach(b=>b.onclick=()=>{S.client=b.dataset.client;if(b.dataset.client!=="p"){S.answers={}}else{S.answers=sampleAnswers()}save();S.tab="visita";render()});
 $("#addc").onclick=()=>toast("No app real abre o cadastro: nome, CNPJ, tipo e endereço.");
}

function vVisita(){
 const st=stats(),c=client(),done=st.total-st.open;
 $("#view").innerHTML=`<div class="label">Visita de ${today}</div><h2>${esc(c.name)}</h2>
 <p class="sub">Checklist RDC 216 · ${done} de ${st.total} itens respondidos</p>
 <div class="stack">
  <div class="progress" aria-label="Progresso"><i style="width:${done/st.total*100}%"></i></div>
  <div class="sumrow"><div class="pill p-ok"><strong>${st.c}</strong>Conforme</div><div class="pill p-bad"><strong>${st.nc}</strong>Não conforme</div><div class="pill p-na"><strong>${st.na}</strong>Não se aplica</div></div>
  ${BLOCKS.map((b,bi)=>{const bs=stats(b.code);return `<details class="block" ${bi===0||bs.nc?"open":""}>
   <summary><span class="code">${b.code}</span><div class="grow"><div class="bname">${b.name}</div><div class="bmeta">${bs.total-bs.open}/${bs.total} · ${bs.nc?`<span class="tone-bad">${bs.nc} NC</span>`:"sem NC"}</div></div>
   <span class="score tone-${tone(bs.pct)}" style="font-size:16px;min-width:auto">${bs.c+bs.nc?bs.pct+"%":"–"}</span><span class="chev">›</span></summary>
   ${b.items.map(([ref,text])=>itemHTML(ref,text)).join("")}</details>`}).join("")}
  <button class="btn" id="fin">Ver relatório da visita</button>
 </div>`;
 bindItems();$("#fin").onclick=()=>{S.tab="relatorio";render()};
}
function itemHTML(ref,text){const a=S.answers[ref]||{};const id="i"+ref.replace(/\./g,"_");
 return `<div class="item" data-ref="${ref}"><span class="ref">RDC 216 · ${ref}</span><p>${esc(text)}</p>
 <div class="seg" role="group" aria-label="Resposta">
  <button class="c" aria-pressed="${a.v==="c"}" data-v="c">C</button><button class="nc" aria-pressed="${a.v==="nc"}" data-v="nc">NC</button><button class="na" aria-pressed="${a.v==="na"}" data-v="na">NA</button></div>
 ${a.v==="nc"?`<div class="ncbox">
  <label for="${id}o">O que foi encontrado</label><textarea id="${id}o" data-f="obs">${esc(a.obs)}</textarea>
  <label for="${id}a">Ação corretiva</label><input id="${id}a" data-f="acao" value="${esc(a.acao)}">
  <div class="two"><div><label for="${id}r">Responsável</label><input id="${id}r" data-f="resp" value="${esc(a.resp)}"></div>
  <div><label for="${id}p">Prazo</label><input id="${id}p" data-f="prazo" value="${esc(a.prazo)}"></div></div>
  <div class="photo">${S.photos[ref]?`<img src="${S.photos[ref]}" alt="Foto do item ${ref}">`:""}<label class="filebtn">📷 ${S.photos[ref]?"Trocar foto":"Anexar foto"}<input type="file" accept="image/*" id="${id}f"></label></div>
 </div>`:""}</div>`}
function bindItems(){document.querySelectorAll(".item").forEach(el=>{const ref=el.dataset.ref;
 el.querySelectorAll(".seg button").forEach(b=>b.onclick=()=>{const cur=S.answers[ref]||{};S.answers[ref]={...cur,v:cur.v===b.dataset.v?undefined:b.dataset.v};save();const y=window.scrollY;vVisita();window.scrollTo(0,y)});
 el.querySelectorAll("[data-f]").forEach(inp=>inp.oninput=()=>{S.answers[ref]={...S.answers[ref],[inp.dataset.f]:inp.value};save()});
 const f=el.querySelector("input[type=file]");if(f)f.onchange=()=>{const file=f.files[0];if(!file)return;const r=new FileReader();r.onload=()=>{S.photos[ref]=r.result;const y=window.scrollY;vVisita();window.scrollTo(0,y)};r.readAsDataURL(file)};
})}

function vRelatorio(){
 const st=stats(),c=client(),ncs=ALL.filter(i=>S.answers[i.ref]?.v==="nc");
 const R=40,C=2*Math.PI*R;
 $("#view").innerHTML=`<div class="label">Prévia do PDF</div><h2>Relatório de inspeção</h2><p class="sub">É isso que o cliente recebe no WhatsApp.</p>
 <div class="stack"><article class="sheet">
  <div class="shead"><div><h3>Relatório de Inspeção Sanitária</h3><div class="tiny">Base: RDC 216/2004 – Anvisa</div></div>
   <div class="tiny" style="text-align:right"><b style="color:var(--sheet-ink)">Ana Lima</b><br>Nutricionista · CRN-3 00000</div></div>
  <div class="tiny">Estabelecimento</div><div style="font-weight:700">${esc(c.name)}</div>
  <div class="tiny" style="margin-bottom:8px">${c.type} · ${c.city} · Visita em ${today}</div>
  <div class="gauge"><svg width="96" height="96" viewBox="0 0 96 96" role="img" aria-label="Conformidade geral ${st.pct}%">
   <circle cx="48" cy="48" r="${R}" fill="none" stroke="var(--line)" stroke-width="10"/>
   <circle cx="48" cy="48" r="${R}" fill="none" stroke="${toneColor(st.pct)}" stroke-width="10" stroke-linecap="round" stroke-dasharray="${C*st.pct/100} ${C}" transform="rotate(-90 48 48)"/>
   <text x="48" y="54" text-anchor="middle" font-family="Bricolage Grotesque, sans-serif" font-weight="800" font-size="22" fill="var(--sheet-ink)">${st.pct}%</text></svg>
   <div><div style="font-weight:700">Conformidade geral</div><div class="tiny">${st.c} conformes · ${st.nc} não conformes · ${st.na} não se aplicam${st.open?` · ${st.open} sem resposta`:""}</div></div></div>
  <div class="bars">${BLOCKS.map(b=>{const s=stats(b.code);const has=s.c+s.nc;return `<div class="bar"><span>${b.code} ${b.name}</span><span class="t"><i style="width:${has?s.pct:0}%;background:${toneColor(s.pct)}"></i></span><span class="v">${has?s.pct+"%":"–"}</span></div>`}).join("")}</div>
  <div style="font-weight:700;margin-bottom:6px">Não conformidades e plano de ação</div>
  ${ncs.length?`<div class="tablewrap"><table><thead><tr><th>Item</th><th>Encontrado</th><th>Ação</th><th>Resp.</th><th>Prazo</th></tr></thead><tbody>
  ${ncs.map(i=>{const a=S.answers[i.ref];return `<tr><td><span class="code">${i.ref}</span>${S.photos[i.ref]?`<br><img src="${S.photos[i.ref]}" alt="">`:""}</td><td>${esc(a.obs||i.text)}</td><td>${esc(a.acao||"—")}</td><td>${esc(a.resp||"—")}</td><td>${esc(a.prazo||"—")}</td></tr>`}).join("")}
  </tbody></table></div>`:`<p class="tiny">Nenhuma não conformidade nesta visita.</p>`}
  <div class="sign"><div>Ana Lima · CRN-3 00000</div><div>Responsável pelo estabelecimento</div></div>
 </article>
 <button class="btn" id="pdf">Gerar PDF e enviar no WhatsApp</button>
 <button class="btn ghost" id="copy">Copiar resumo para o WhatsApp</button>
 <p class="note">Nesta prévia o botão de PDF só mostra o que acontece. No app vendido ele gera o arquivo com a sua logo e abre o WhatsApp do cliente.</p></div>`;
 $("#pdf").onclick=()=>toast("No app real: gera o PDF com sua logo e abre o WhatsApp do cliente.");
 $("#copy").onclick=async()=>{const txt=`*Relatório de inspeção – ${c.name}* (${today})\nConformidade geral: *${st.pct}%*\n\nPontos a corrigir:\n${ncs.map(i=>`• ${S.answers[i.ref].acao||i.text} – prazo: ${S.answers[i.ref].prazo||"a definir"}`).join("\n")}\n\nAna Lima · Nutricionista · CRN-3 00000`;
  try{await navigator.clipboard.writeText(txt);toast("Resumo copiado. É só colar no WhatsApp.")}catch(e){toast("Não deu para copiar neste navegador.")}};
}

function vHistorico(){
 const c=client(),pts=[...c.hist,["Out",stats().pct]];
 const W=320,H=170,pl=34,pr=12,pt=14,pb=26,x=i=>pl+(pts.length===1?0:i*(W-pl-pr)/(pts.length-1)),y=v=>pt+(100-v)*(H-pt-pb)/100;
 const line=pts.map((p,i)=>`${x(i)},${y(p[1])}`).join(" ");
 const area=`${x(0)},${y(0)} ${line} ${x(pts.length-1)},${y(0)}`;
 const first=pts[0][1],last=pts[pts.length-1][1];
 $("#view").innerHTML=`<div class="label">Evolução do cliente</div><h2>${esc(c.name)}</h2>
 <p class="sub">${last>=first?`Subiu ${last-first} pontos desde a primeira visita.`:`Caiu ${first-last} pontos desde a primeira visita.`} É esse gráfico que justifica a consultoria mensal.</p>
 <div class="stack"><div class="card chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Conformidade por mês">
  ${[0,50,80,100].map(v=>`<line x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-dasharray="${v===80?"4 4":""}"/><text x="${pl-6}" y="${y(v)+4}" text-anchor="end" font-size="10" fill="var(--muted)">${v}%</text>`).join("")}
  <text x="${W-pr}" y="${y(80)-5}" text-anchor="end" font-size="10" fill="var(--ok)">meta 80%</text>
  <polygon points="${area}" fill="var(--accent)" opacity=".12"/>
  <polyline points="${line}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round"/>
  ${pts.map((p,i)=>`<circle cx="${x(i)}" cy="${y(p[1])}" r="${i===pts.length-1?5:3.5}" fill="${i===pts.length-1?"var(--accent)":"var(--surface)"}" stroke="var(--accent)" stroke-width="2"/><text x="${x(i)}" y="${H-8}" text-anchor="middle" font-size="10.5" fill="var(--muted)">${p[0]}</text>`).join("")}
 </svg></div>
 <div class="card"><ul class="hist">${pts.slice().reverse().map((p,i)=>`<li><span>${p[0]}/2026 ${i===0?"· visita atual":""}</span><b class="tone-${tone(p[1])}">${p[1]}%</b></li>`).join("")}</ul></div>
 <button class="btn ghost" id="trein">Gerar certificado de treinamento</button></div>`;
 $("#trein").onclick=()=>toast("No app real: lista de presença + certificado do treinamento de manipuladores em PDF.");
}

document.querySelectorAll("nav.tabs button").forEach(b=>b.onclick=()=>{S.tab=b.dataset.tab;save();render()});
render();
</script>
